<!DOCTYPE html>
<html>


    <head>
        <title>Student Result Analyzer</title>
        <link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='images/logo.png.jpeg') }}">
        <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/style.css') }}">

    </head>
    <body>
        <div id="heading">
            <h1>Student Result Analyzer</h1>
            <p>Welcome to the Student Result Analyzer!</p>
        </div>

        <div class="container">
            <div class="form-container">
                <form action="/submit" method="post" enctype="multipart/form-data">


                <label for="file_type">File Type</label>
                <select id="file_type" name="file_type">
                    <option value="csv">.csv</option>
                    <option value="xlsx">.xlsx</option>
                    <option value="other">Other</option>
                </select><br>

                <label for="myfile">Select a file:</label>
                <input type="file" id="myfile" name="myfile" accept=".csv,.xlsx"><br><br>
                <input type="submit" value="Submit">
            </form>
            </div>



        </div>

        

    </body>
</html>
