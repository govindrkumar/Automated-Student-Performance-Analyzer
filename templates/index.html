<!DOCTYPE html>
<html>


    <!-- Shared page metadata and stylesheet. -->
    <head>
        <title>Student Result Analyzer</title>
        <link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='images/logo.png.jpeg') }}">
        <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/style.css') }}">

    </head>
    <body>
        <!-- Landing heading shown on the home page. -->
        <div id="heading">
            <h1>Student Result Analyzer</h1>
            <p>Welcome to the Student Result Analyzer!</p>
        </div>
        

        <!--This is my start of comments-->

<div class="container">
            <div class="form-container">
                <!-- Start the manual-entry workflow with row counts. -->
                <form action="/result_calc" method="post">
                <label for="student_no">No. of Students</label>
                <input type="number" id="student_no" name="student_no" placeholder="30"><br>

                <label for="suject_no">No. of Subject taught</label>
                <input type='number' id="subject_no" autocomplete="off" name="subject_no" placeholder="5"><br>


                <input type="submit" value="Submit">
                </form>
            </div>



        </div>


            <!-- Link to the spreadsheet upload workflow. -->
            <div class="normality">
                <a href="{{ url_for('dashboard') }}"><h2>Already Have Student Marks ?</h2></a>
            </div>
    </body>
</html>
